[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-to-formatted-xlsx"
version = "0.1.0"
description = "Safely convert CSV reports to formatted XLSX files without losing identifiers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bruce Yang" }]
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pyinstaller>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
csv-to-formatted-xlsx = "csv_to_formatted_xlsx.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
